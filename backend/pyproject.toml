[project]
name = "hem-backend"
version = "0.1.0"
description = "HEM consolidated FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.0",
    "argon2-cffi>=25.1.0",
    "apscheduler>=3.11.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.2",
    "email-validator>=2.3.0",
    "pydantic-settings>=2.12.0",
    "python-multipart>=0.0.20",
    "redis>=7.1.0",
    "reportlab>=4.4.0",
    "sqlalchemy>=2.0.45",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
